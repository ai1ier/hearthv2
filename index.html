<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Star Chapter · TXT Planner</title>
  <meta name="description" content="A dreamy pixel planner for MOA: your calendar becomes quests on a tiny star planet." />
  <!-- install to the home screen as its own app -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#2e2670" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Star Chapter" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='%232e2670'/><rect x='7' y='2' width='2' height='12' fill='%23ffd86a'/><rect x='2' y='7' width='12' height='2' fill='%23ffd86a'/><rect x='5' y='5' width='6' height='6' fill='%23ffd86a'/><rect x='7' y='7' width='2' height='2' fill='%23ffffff'/><rect x='2' y='2' width='1' height='1' fill='%23ffffff'/><rect x='13' y='12' width='1' height='1' fill='%23ffffff'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet" />

  <link href="https://fonts.googleapis.com/css2?family=Tiny5&text=0123456789%25%3A&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body data-phase="day">
  <div id="app"></div>
  <noscript>This planner needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
