<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hearthside Quest Planner</title>
  <!-- install to the home screen as its own app -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#4a2f1d" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Hearthside" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%234a2f1d'/><rect x='3' y='6' width='10' height='8' fill='%23e6d4b0'/><rect x='2' y='4' width='12' height='3' fill='%239a4a36'/><rect x='7' y='9' width='2' height='5' fill='%237a4a2a'/><rect x='4' y='8' width='2' height='2' fill='%23ffcf6e'/><rect x='10' y='8' width='2' height='2' fill='%23ffcf6e'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <!-- Tiny5 only for digits: Pixelify's 5 looks like an S -->
  <link href="https://fonts.googleapis.com/css2?family=Tiny5&text=0123456789%25%3A&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body data-phase="day">
  <div id="app"></div>
  <noscript>This planner needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
